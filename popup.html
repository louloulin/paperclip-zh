<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px/1.5 system-ui, sans-serif; width: 240px; margin: 0; padding: 12px; color: #e5e5e5; background: #18181b; }
      h1 { font-size: 13px; margin: 0 0 10px; }
      label { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
      select { flex: 1; background: #27272a; color: inherit; border: 1px solid #3f3f46; border-radius: 6px; padding: 2px 4px; }
      .stats { margin-top: 10px; color: #a1a1aa; font-size: 12px; }
      .row { display: flex; align-items: center; justify-content: space-between; margin: 8px 0; }
    </style>
  </head>
  <body>
    <h1>Paperclip 中文语言包</h1>
    <label><input type="checkbox" id="enabled" /> 启用汉化</label>
    <div class="row">
      <span>语言</span>
      <select id="override">
        <option value="auto">自动（跟随系统）</option>
        <option value="en">English</option>
        <option value="zh-CN">中文</option>
      </select>
    </div>
    <div class="stats" id="stats">…</div>
    <script src="dist/popup.js"></script>
  </body>
</html>
